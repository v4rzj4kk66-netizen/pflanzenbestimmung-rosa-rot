<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pflanzenbestimmung – Rosa & Rote Blüten</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(to bottom right, #fef2f6, #ffe6ea);
      color: #2b2b2b;
    }

    header {
      background: linear-gradient(135deg, #c2185b, #e91e63);
      color: white;
      padding: 25px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    header h1 {
      margin: 0;
      font-size: 2.2rem;
    }

    header p {
      margin-top: 10px;
      font-size: 1rem;
    }

    .container {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      padding: 20px;
    }

    .main, .sidebar {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    h2 {
      color: #c2185b;
      margin-top: 0;
    }

    .option-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      border: 2px solid #f8bbd0;
      border-radius: 14px;
      overflow: hidden;
      background: #fffafc;
      transition: 0.3s;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
      border-color: #e91e63;
    }

    .card img {
      width: 100%;
      height: auto;
      display: block;
    }

    .card-content {
      padding: 15px;
    }

    .card-content h3 {
      margin-top: 0;
      color: #ad1457;
    }

    button {
      background: #e91e63;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.3s;
      margin-top: 20px;
    }

    button:hover {
      background: #ad1457;
    }

    .path-box {
      background: #fff0f5;
      border-left: 5px solid #e91e63;
      padding: 15px;
      border-radius: 10px;
    }

    .path-step {
      margin-bottom: 10px;
      padding: 10px;
      background: white;
      border-radius: 8px;
      border: 1px solid #f8bbd0;
    }

    .plant-card {
      margin-top: 20px;
      border: 2px solid #e91e63;
      border-radius: 16px;
      overflow: hidden;
      background: #fff7fa;
    }

    .plant-card img {
      width: 100%;
      height: auto;
    }

    .plant-info {
      padding: 20px;
    }

    .plant-info h2 {
      margin-top: 0;
    }

    .info-box {
      background: white;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #f8bbd0;
    }

    footer {
      text-align: center;
      padding: 15px;
      color: #666;
      font-size: 0.9rem;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>🌸 Pflanzenbestimmung – Rosa & Rote Blüten 🌸</h1>
  <p>Interaktive Bestimmungshilfe für den Biologieunterricht</p>
</header>

<div class="container">

  <div class="main">
    <div id="content"></div>
  </div>

  <div class="sidebar">
    <h2>🔎 Bestimmungsweg</h2>
    <div class="path-box" id="pathBox">
      <p>Hier erscheint der gewählte Bestimmungsweg.</p>
    </div>
  </div>

</div>

<footer>
  Erstellt für den Biologieunterricht – Rosa & rote Blütenpflanzen
</footer>

      bild: "images/wegerich.jpg"

  function updatePath(text) {
    path.push(text);
    const box = document.getElementById('pathBox');
    box.innerHTML = path.map(step => `<div class="path-step">${step}</div>`).join('');
  }

  function resetPath() {
    path.length = 0;
    updatePath('Start der Bestimmung');
  }

  function showStart() {
    resetPath();

    document.getElementById('content').innerHTML = `
      <h2>1. Welche Blütenform hat die Pflanze?</h2>
      <div class="option-grid">

        <div class="card" onclick="showEinzelbluete()">
          <img src="images/einzelbluete.jpg" alt="Einzelblüte">
          <div class="card-content">
            <h3>Einzelblüte</h3>
            <p>Die Pflanze besitzt einzelne, klar erkennbare Blüten.</p>
          </div>
        </div>

        <div class="card" onclick="showLippenbluete()">
          <img src="images/lippenbluete.jpg" alt="Lippenblüte">
          <div class="card-content">
            <h3>Lippenblüte</h3>
            <p>Die Blüte erinnert an einen geöffneten Mund mit Ober- und Unterlippe.</p>
          </div>
        </div>

        <div class="card" onclick="showZusammengesetzt()">
          <img src="images/zusammengesetzte_bluete.jpg" alt="Zusammengesetzte Blüte">
          <div class="card-content">
            <h3>Zusammengesetzte Blüte</h3>
            <p>Viele kleine Einzelblüten bilden gemeinsam einen Blütenstand.</p>
          </div>
        </div>

      </div>
    `;
  }

  function showEinzelbluete() {
    updatePath('Blütenform: Einzelblüte');

    document.getElementById('content').innerHTML = `
      <h2>2. Wie viele Kronblätter hat die Blüte?</h2>

      <div class="option-grid">

        <div class="card" onclick="showPlants('vier unsymmetrisch', ['Futterwicke', 'Zaunwicke', 'Vogelwicke', 'Breitblättrige Platterbse'])">
          <img src="images/vier_unsymmetrisch.jpg" alt="Vier unsymmetrische Kronblätter">
          <div class="card-content">
            <h3>Vier unsymmetrische Kronblätter</h3>
            <p>Achtung: Manchmal wirken es wie mehr Blätter.</p>
          </div>
        </div>

        <div class="card" onclick="showPlants('vier symmetrisch', ['Wiesenschaumkraut', 'Klatschmohn', 'Kleinblättriges Weidenröschen', 'Schmalblättriges Weidenröschen', 'Zottiges Weidenröschen'])">
          <img src="images/vier_symmetrisch.jpg" alt="Vier symmetrische Kronblätter">
          <div class="card-content">
            <h3>Vier symmetrische Kronblätter</h3>
            <p>Die Blütenblätter sind regelmäßig angeordnet.</p>
          </div>
        </div>

        <div class="card" onclick="showPlants('fünf Kronblätter', ['Rote Lichtnelke', 'Prachtnelke', 'Ruprechtskraut', 'Purpur-Storchschnabel', 'Wald-Storchschnabel', 'Pyrenäen-Storchschnabel', 'Gewöhnlicher Reiherschnabel', 'Wald-Vergissmeinnicht', 'Bach-Nelkenwurz', 'Moschus-Malve', 'Rosen-Malve', 'Ackerwinde'])">
          <img src="images/fuenf_kronblaetter.jpg" alt="Fünf Kronblätter">
          <div class="card-content">
            <h3>Fünf Kronblätter</h3>
            <p>Achtung: Oft wirken die Blüten wie zehnteilig.</p>
          </div>
        </div>

        <div class="card" onclick="showPlants('viele Kronblätter', ['Ackerkratzdistel', 'Orangerotes Habichtskraut'])">
          <img src="images/viele_kronblaetter.jpg" alt="Viele Kronblätter">
          <div class="card-content">
            <h3>Viele Kronblätter</h3>
            <p>Viele kleine Blütenblätter bilden die Blüte.</p>
          </div>
        </div>

      </div>

      <button onclick="showStart()">⬅ Zurück</button>
    `;
  }

  function showLippenbluete() {
    updatePath('Blütenform: Lippenblüte');

    showPlants('Lippenblüten', [
      'Rote Taubnessel',
      'Wald-Ziest',
      'Roter Fingerhut',
      'Feld-Thymian',
      'Gewöhnlicher Dost (Oregano)'
    ]);
  }

  function showZusammengesetzt() {
    updatePath('Blütenform: Zusammengesetzte Blüte');

    document.getElementById('content').innerHTML = `
      <h2>2. Welche Form hat der Blütenstand?</h2>

      <div class="option-grid">

        <div class="card" onclick="showPlants('Köpfchen', ['Wiesenklee (Rotklee)', 'Zickzack-Klee', 'Acker-Witwenblume'])">
          <img src="images/koepfchen.jpg" alt="Köpfchen">
          <div class="card-content">
            <h3>Blüten mit Köpfchen</h3>
            <p>Viele kleine Blüten sitzen dicht zusammen.</p>
          </div>
        </div>

        <div class="card" onclick="showPlants('Ähren/Scheinähren', ['Schlangenknöterich', 'Mittlerer Wegerich'])">
          <img src="images/aehren.jpg" alt="Ähren">
          <div class="card-content">
            <h3>Ähren / Scheinähren</h3>
            <p>Die Blüten wachsen länglich angeordnet.</p>
          </div>
        </div>

      </div>

      <button onclick="showStart()">⬅ Zurück</button>
    `;
  }

  function showPlants(category, plantList) {
    updatePath(category);

    let html = `<h2>Passende Pflanzenarten</h2><div class="option-grid">`;

    plantList.forEach(plant => {
      html += `
        <div class="card" onclick="showPlantCard('${plant}')">
          <img src="${plants[plant].bild}" alt="${plant}">
          <div class="card-content">
            <h3>${plant}</h3>
            <p>Klicke für eine Pflanzenkarte.</p>
          </div>
        </div>
      `;
    });

    html += `</div><button onclick="showStart()">⬅ Neue Bestimmung</button>`;

    document.getElementById('content').innerHTML = html;
  }

  function showPlantCard(plant) {
    updatePath('Pflanze bestimmt: ' + plant);

    const p = plants[plant];

    document.getElementById('content').innerHTML = `
      <div class="plant-card">
        <img src="${p.bild}" alt="${plant}">

        <div class="plant-info">
          <h2>${plant}</h2>

          <div class="info-box">
            <strong>Familie:</strong><br>
            ${p.familie}
          </div>

          <div class="info-box">
            <strong>Typischer Fundort:</strong><br>
            ${p.fundort}
          </div>

          <div class="info-box">
            <strong>Blütezeit:</strong><br>
            ${p.bluetezeit}
          </div>

          <button onclick="showStart()">🔄 Neue Pflanze bestimmen</button>
        </div>
      </div>
    `;
  }

  showStart();
</script>

</body>
</html>
